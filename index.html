  function dayKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function rewardText(rw) { return Object.entries(rw).map(([k, n]) => `${ITEM_NAMES[k]}×${n}`).join('・'); }
  function rewardIcon(rw) {
    const k = Object.keys(rw)[0];
    if (k === 'moves') return `<span class="mini" data-t="3">${ICONS[3]}</span>`;
    if (TOOL_ICONS_G[k] || ['row', 'col'].includes(k)) return `<span class="mini" data-sp="h">${k === 'row' ? SP_ICONS.h : k === 'col' ? SP_ICONS.v : TOOL_ICONS_G[k]}</span>`;
    return `<span class="mini" data-sp="${k}">${SP_ICONS[k]}</span>`;
  }
  function checkLogin() {
    const today = dayKey();
    if (progress.lastLogin === today) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const streak = progress.lastLogin === dayKey(y) ? (progress.streak || 0) + 1 : 1;
    const idx = (streak - 1) % 7;
    const rw = LOGIN_REWARDS[idx];
    const cells = LOGIN_REWARDS.map((r, i) => `<div class="lb ${i < idx ? 'got' : ''} ${i === idx ? 'today' : ''}"><span class="lbd">${i + 1}日目</span>${rewardIcon(r)}<span class="lbn">${rewardText(r)}</span></div>`).join('');
    showOverlay(`
      ${kinCard('cheer', '今日の差し入れだ！受け取れ！')}
      <div class="label">ログインボーナス</div>
      <div class="big" style="font-size:1.35rem">${streak}日連続ログイン！</div>
      <div class="lbgrid">${cells}</div>
      <p>今日のボーナス<br><b style="color:var(--accent)">${rewardText(rw)}</b></p>
      <p style="font-size:.75rem">もらったアイテムはストックされ、ブーストや道具で重量を払わずに使えます。1日休むと1日目に戻ります</p>`,
      [{ label: '受け取る', fn: () => {
        if (progress.lastLogin !== today) {
          for (const [k, n] of Object.entries(rw)) progress.inv[k] = (progress.inv[k] || 0) + n;
          progress.lastLogin = today;
          progress.streak = streak;
          save();
          SFX.clear();
        }
        hideOverlay();
      } }]);
  }

  // ---------- 道具（手数を使わずに使える。貯めた重量で払う） ----------
  const TOOL_ICONS = {
    punch: '<svg viewBox="0 0 40 40"><path d="M13 13a6 6 0 0 1 6-6h7a8 8 0 0 1 8 8v9a8 8 0 0 1-8 8h-7a6 6 0 0 1-6-6z"/><path d="M13 23h-3.5a3.5 3.5 0 0 1 0-7H13z"/><rect x="13" y="31" width="19" height="6" rx="2"/></svg>',
    row: SP_ICONS.h,
    col: SP_ICONS.v,
    shuffle: '<svg viewBox="0 0 40 40"><path d="M6 13h20l-5-5M34 27H14l5 5" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const TOOLS = [
    { id: 'punch', name: 'パンチ', price: 2000, tip: '壊したいマスをタップ' },
    { id: 'row', name: '横一列', price: 3000, tip: '消したい横の列をタップ' },
    { id: 'col', name: '縦一列', price: 3000, tip: '消したい縦の列をタップ' },
    { id: 'shuffle', name: 'ストレッチ', price: 2000, tip: '' }
  ];
  let aiming = null;
  $('toolbar').innerHTML = TOOLS.map(t => `<button type="button" class="tool" data-tool="${t.id}">${TOOL_ICONS[t.id]}<span>${t.name}</span><span class="tp"></span></button>`).join('');
  function renderTools() {
    const kg = progress.kg || 0;
    $('walletG').textContent = kg.toLocaleString();
    document.querySelectorAll('.tool').forEach(btn => {
      const t = TOOLS.find(x => x.id === btn.dataset.tool);
      btn.classList.toggle('on', aiming === t.id);
      btn.disabled = aiming !== t.id && stock(t.id) <= 0 && t.price > kg;
      const tp = btn.querySelector('.tp');
      tp.textContent = priceLabel(t);
      tp.classList.toggle('free', stock(t.id) > 0);
    });
    board.classList.toggle('aiming', !!aiming);
    const tip = $('aimtip');
    tip.hidden = !aiming;
    if (aiming) tip.textContent = TOOLS.find(x => x.id === aiming).tip + '（もう一度押すとやめる）';
  }
  function cancelAim() { aiming = null; renderTools(); }
  $('toolbar').addEventListener('click', e => {
    const btn = e.target.closest('.tool');
    if (!btn || btn.disabled) return;
    const t = TOOLS.find(x => x.id === btn.dataset.tool);
    if (aiming === t.id) { cancelAim(); return; }
    if (busy || $('overlay')) return;
    clearSel(); clearHint();
    SFX.select();
    if (t.id === 'shuffle') { useTool(t, -1, -1); return; }
    aiming = t.id;
    renderTools();
  });
  async function useTool(t, r, c) {
    const free = stock(t.id) > 0;
    if (busy || (!free && (progress.kg || 0) < t.price)) { cancelAim(); return; }
    busy = true;
    aiming = null;
    if (free) progress.inv[t.id]--; else progress.kg -= t.price;
    save();
    renderTools();
    clearHint(); clearSel();
    const keepSweat = sweatCleared;
    if (t.id === 'shuffle') {
      await shuffle();
    } else {
      const k = r * N + c;
      let act;
      if (t.id === 'punch') act = grid[r][c]?.sp ? { k } : { k, sp: 'hit1' };
      else act = { k, sp: t.id === 'row' ? 'h' : 'v' };
      pendingNote = `<em>${t.name}！</em>`;
      await resolve(new Set(), [act], false);
    }
    sweatCleared = keepSweat;
    if (goalsDone()) return stageClear();
    if (!anySpecial() && !findMove(typesOf())) await shuffle();
    busy = false;
    renderTools();
    scheduleHint();
  }

  function startStage(i) {
    stageIdx = i;
    aiming = null;
    stage = getStage(i);
    BGM.stop();
    hideOverlay();
    $('menuView').hidden = true;
    $('gameView').hidden = false;
    $('retry').hidden = false;
    $('toMenu').hidden = false;
    $('title').hidden = true;
    $('voice').hidden = true;
    fitBoard();
    moves = stage.moves;
    score = 0;
    busy = true;
    clearHint(); clearSel();
    buildBoard();
    goals = { ...stage.goals };
    const L = stage.layout.join('');
    const cnt = ch => L.split(ch).length - 1;
    if (stage.bossHp) goals.boss = stage.bossHp;
    if (cnt('b')) goals.box = cnt('b');
    if (cnt('t')) goals.tire = cnt('t');
    if (cnt('l')) goals.locker = cnt('l');
    if (cnt('s')) goals.sweat = cnt('s');
    movesUsed = 0;
    sweatCleared = false;
    renderHud(); renderGoals(); renderTools();
    const stars = progress.stars[i] || 0;
    const sel = new Set();
    const boostHtml = () => `
       <div class="label">ブースト（貯めた重量で使える）</div>
       <div class="boost">${BOOSTS.map(b => `<button type="button" class="bst" data-b="${b.id}"><span class="mini" ${b.sp ? `data-sp="${b.sp}"` : 'data-t="3"'}>${b.sp ? SP_ICONS[b.sp] : ICONS[3]}</span><span class="bt">${b.name}<small>${b.desc}</small><b class="price ${stock(b.id) > 0 ? 'free' : ''}">${priceLabel(b)}</b></span></button>`).join('')}</div>
       <p class="wallet-line" id="walletLine"></p>`;
    const costOf = id => (stock(id) > 0 ? 0 : BOOSTS.find(b => b.id === id).price);
    const refreshBoost = () => {
      const cost = [...sel].reduce((a, id) => a + costOf(id), 0);
      const left = (progress.kg || 0) - cost;
      document.querySelectorAll('.bst').forEach(btn => {
        const b = BOOSTS.find(x => x.id === btn.dataset.b);
        const on = sel.has(b.id);
        btn.classList.toggle('on', on);
        btn.disabled = !on && costOf(b.id) > left;
        btn.setAttribute('aria-pressed', String(on));
      });
      const wl = $('walletLine');
      if (wl) wl.innerHTML = `所持 <b>${(progress.kg || 0).toLocaleString()} kg</b>${cost ? ` → 使ったあと <b>${left.toLocaleString()} kg</b>` : ''}`;
    };
    const startPlay = () => {
      const cost = [...sel].reduce((a, id) => a + costOf(id), 0);
      if (cost > (progress.kg || 0)) sel.clear();
      hideOverlay(); SFX.start();
      if (sel.size) {
        for (const id of sel) { if (stock(id) > 0) progress.inv[id]--; }
        progress.kg -= cost; save();
        applyBoosts([...sel]);
      }
      busy = false; scheduleHint(); renderTools();
      setTimeout(() => BGM.start(songName()), 300);
    };
    const showStart = () => { showOverlay(
      `<div class="label">DAY ${i + 1}・${partLabel(stage)}</div>
       <div class="big">${stage.name}</div>
       <p>${stage.moves}手以内に${stage.bossHp ? 'コーチを倒そう' : 'クリアしよう'}</p>
       <div class="goals" style="justify-content:center">${goalsHtml(goals)}</div>
       ${stars ? `<div class="stars" style="transform:scale(.6)">${[0, 1, 2].map(k => STAR.replace('<svg', `<svg class="${k < stars ? 'on' : ''}"`)).join('')}</div>` : ''}
       ${boostHtml()}`,
      [
        { label: 'メニュー', sub: true, fn: showMenu },
        { label: 'スタート', fn: startPlay }
      ]
    );
      document.querySelectorAll('.bst').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.b;
        if (sel.has(id)) sel.delete(id); else sel.add(id);
        SFX.select(); refreshBoost();
      }));
      refreshBoost();
    };
    if (!seenGuide) showGuide(showStart); else showStart();
  }

  const BOOSTS = [
    { id: 'moves', name: 'プロテインバー', desc: '手数+5', price: 4000 },
    { id: 'h', sp: 'h', name: 'バーベル', desc: '最初から置く', price: 3000 },
    { id: 'bomb', sp: 'bomb', name: 'メディシンボール', desc: '最初から置く', price: 5000 },
    { id: 'color', sp: 'color', name: 'ゴールデンプロテイン', desc: '最初から置く', price: 8000 }
  ];
  function applyBoosts(ids) {
    const pool = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (t && t.t >= 0 && !isLocked(r, c)) pool.push(t);
    }
    for (const id of ids) {
      if (id === 'moves') { moves += 5; renderHud(); continue; }
      if (!pool.length) continue;
      const t = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      setSpecial(t, id === 'h' ? (Math.random() < 0.5 ? 'h' : 'v') : id);
    }
    SFX.spawn();
    toast('<em>ブースト！</em>');
  }

  function buildBoard() {
    board.innerHTML = '';
    grid = []; obs = []; hole = []; lockMask = []; lockEls = []; bossObj = null;
    for (let r = 0; r < N; r++) {
      grid.push(Array(N).fill(null));
      obs.push(Array(N).fill(null));
      lockEls.push(Array(N).fill(null));
      hole.push(stage.layout[r].split('').map(ch => ch === 'x'));
      lockMask.push(stage.layout[r].split('').map(ch => (ch === 'l' ? 1 : 0)));
    }
    // マス目の背景（角を丸める）
    const open = (r, c) => inB(r, c) && !hole[r][c];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (hole[r][c]) continue;
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (!open(r - 1, c) && !open(r, c - 1)) cell.classList.add('r-tl');
      if (!open(r - 1, c) && !open(r, c + 1)) cell.classList.add('r-tr');
      if (!open(r + 1, c) && !open(r, c - 1)) cell.classList.add('r-bl');
      if (!open(r + 1, c) && !open(r, c + 1)) cell.classList.add('r-br');
      posStyle(cell, r, c);
      board.appendChild(cell);
    }
    // 障害物
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const ch = stage.layout[r][c];
      if (ch === 'B') {
        if (obs[r][c]) continue;
        const el = document.createElement('div');
        el.className = 'boss';
        el.style.left = c * 12.5 + '%';
        el.style.top = r * 12.5 + '%';
        el.innerHTML = `${OBS_ICONS.boss}<div class="hp"><i></i></div>`;
        board.appendChild(el);
        const o = { kind: 'boss', hp: stage.bossHp, max: stage.bossHp, el, bar: el.querySelector('.hp i'), cells: [] };
        for (const [dr, dc] of [[0, 0], [0, 1], [1, 0], [1, 1]]) { obs[r + dr][c + dc] = o; o.cells.push([r + dr, c + dc]); }
        bossObj = o;
        continue;
      }
      const kind = ch === 'b' ? 'box' : ch === 't' ? 'tire' : ch === 's' ? 'sweat' : null;
      if (kind) makeObs(kind, r, c);
    }
    // アイテム
    const types = safeTypes();
    const all = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (types[r][c] === -1) continue;
      const tile = makeTile(types[r][c]);
      tile.el.style.transition = 'none';
      place(tile, r - N, c);
      tile.r = r; grid[r][c] = tile;
      all.push(tile);
    }
    board.offsetWidth;
    all.forEach(t => { t.el.style.transition = ''; place(t, t.r, t.c); });
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (lockMask[r][c] && grid[r][c]) addLock(r, c, 1, false);
  }

  function makeObs(kind, r, c) {
    const el = document.createElement('div');
    el.className = 'obs';
    el.dataset.o = kind;
    el.innerHTML = `<div class="in">${OBS_ICONS[kind]}</div>`;
    posStyle(el, r, c);
    board.appendChild(el);
    obs[r][c] = { kind, hp: OBS_INFO[kind].hp, el };
    return obs[r][c];
  }
  // v: 1 = ステージのロッカー（目標に数える） / 2 = コーチの喝で閉じこめられた
  function addLock(r, c, v, anim = true) {
    lockMask[r][c] = v;
    const el = document.createElement('div');
    el.className = 'lockov' + (anim ? ' born' : '');
    el.innerHTML = OBS_ICONS.locker;
    posStyle(el, r, c);
    board.appendChild(el);
    lockEls[r][c] = el;
    grid[r][c]?.el.classList.add('locked');
  }
  function unlock(k) {
    const r = Math.floor(k / N), c = k % N, v = lockMask[r][c];
    lockMask[r][c] = 0;
    const el = lockEls[r][c];
    lockEls[r][c] = null;
    if (el) { el.classList.add('gone'); setTimeout(() => el.remove(), 320); }
    grid[r][c]?.el.classList.remove('locked');
    if (v === 1 && goals.locker > 0) { goals.locker--; updateGoal('locker'); }
  }

  async function stageClear() {
    busy = true;
    BGM.stop();
    clearHint();
    const left = moves;
    const bonus = left * 50;
    score += bonus; renderHud();
    const ratio = left / stage.moves;
    const stars = ratio >= 0.4 ? 3 : ratio >= 0.2 ? 2 : 1;
    progress.stars[stageIdx] = Math.max(progress.stars[stageIdx] || 0, stars);
    progress.unlocked = Math.max(progress.unlocked, stageIdx + 1);
    progress.kg = (progress.kg || 0) + score;
    save();
    SFX.clear();
    toast('<em>クリア！</em>');
    await sleep(900);
    showOverlay(
      `${kinCard('cheer', stage.bossHp ? 'コーチに勝った！最高の筋肉だ！' : pick(['ナイスバルク！', 'キレてるよ！', '今日もいいパンプだ！', 'その調子、明日も来いよ！']))}
       <div class="big good">トレーニング完了！</div>
       <div class="stars">${[0, 1, 2].map(k => STAR.replace('<svg', `<svg class="${k < stars ? 'on' : ''}" style="animation-delay:${k * 0.25}s"`)).join('')}</div>
       <p>${stage.name}　総挙上量 <b style="color:var(--chalk)">${score.toLocaleString()} kg</b><br>残り${left}手ボーナス +${bonus.toLocaleString()} kg</p>
       <p>貯めた重量 <b style="color:var(--accent)">${progress.kg.toLocaleString()} kg</b>（+${score.toLocaleString()}）</p>`,
      [
        { label: 'メニュー', sub: true, fn: showMenu },
        { label: '次の日へ', fn: () => startStage(stageIdx + 1) }
      ]
    );
    for (let k = 0; k < stars; k++) setTimeout(() => SFX.star(k), 250 + k * 250);
  }

  async function stageFail() {
    busy = true;
    BGM.stop();
    clearHint();
    SFX.fail();
    const earned = Math.floor(score / 2);
    progress.kg = (progress.kg || 0) + earned;
    save();
    await sleep(400);
    const rest = {};
    for (const t in goals) if (goals[t] > 0) rest[t] = goals[t];
    showOverlay(
      `${kinCard('grit', pick(['あと1レップ！もう一回いこう', '限界の先に成長がある！', 'ブーストや道具も使っていいんだぞ']))}
       <div class="big">手数切れ…</div>
       <p>あと少し！残りの目標</p>
       <div class="goals" style="justify-content:center">${goalsHtml(rest)}</div>
       <p>挙げた重量の半分 +${earned.toLocaleString()} kg を貯めました</p>`,
      [
        { label: 'メニュー', sub: true, fn: showMenu },
        { label: 'もう一度', fn: () => startStage(stageIdx) }
      ]
    );
  }

  // ---------- 演出 ----------
  function toast(html) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = html;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
  function flash(sp, k, to) {
    const r = Math.floor(k / N), c = k % N, u = 12.5;
    const el = document.createElement('div');
    if (sp === 'db') {
      el.className = 'fx boom';
      Object.assign(el.style, { left: (c - 1) * u + '%', top: (r - 1) * u + '%', width: 3 * u + '%', height: 3 * u + '%' });
      if (to != null) {
        const r2 = Math.floor(to / N), c2 = to % N;
        const fly = document.createElement('div');
        fly.className = 'fly';
        fly.innerHTML = SP_ICONS.db;
        board.appendChild(fly);
        const a = fly.animate([
          { transform: `translate(${c * 100}%, ${r * 100}%) rotate(0deg) scale(1)` },
          { transform: `translate(${(c + c2) * 50}%, ${(r + r2) * 50 - 120}%) rotate(360deg) scale(1.5)`, offset: 0.5 },
          { transform: `translate(${c2 * 100}%, ${r2 * 100}%) rotate(720deg) scale(1)` }
        ], { duration: 420, easing: 'ease-in' });
        a.onfinish = () => { fly.remove(); flash('hit', to); };
      }
      board.appendChild(el);
      setTimeout(() => el.remove(), 450);
      return;
    }
    if (sp === 'hit1') sp = 'hit';
    if (sp === 'hit') { el.className = 'fx boom'; Object.assign(el.style, { left: (c - 0.5) * u + '%', top: (r - 0.5) * u + '%', width: 2 * u + '%', height: 2 * u + '%' }); board.appendChild(el); setTimeout(() => el.remove(), 450); return; }
    if (sp === 'h') { el.className = 'fx line'; Object.assign(el.style, { left: 0, width: '100%', top: r * u + '%', height: u + '%' }); }
    else if (sp === 'v') { el.className = 'fx line v'; Object.assign(el.style, { top: 0, height: '100%', left: c * u + '%', width: u + '%' }); }
    else if (sp === 'bomb') { el.className = 'fx boom'; Object.assign(el.style, { left: (c - 2) * u + '%', top: (r - 2) * u + '%', width: 5 * u + '%', height: 5 * u + '%' }); }
    else el.className = 'fx all';
    board.appendChild(el);
    setTimeout(() => el.remove(), 450);
  }

  // ---------- 特殊アイテムの効果範囲 ----------
  function mostCommonType() {
    const cnt = Array(TYPES).fill(0);
    grid.flat().forEach(t => { if (t && t.t >= 0) cnt[t.t]++; });
    return cnt.indexOf(Math.max(...cnt));
  }
  function effectCells(sp, k, target) {
    const r = Math.floor(k / N), c = k % N, out = [];
    if (sp === 'h') for (let x = 0; x < N; x++) out.push(r * N + x);
    else if (sp === 'v') for (let y = 0; y < N; y++) out.push(y * N + c);
    else if (sp === 'bomb') {
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        if (inB(r + dr, c + dc)) out.push((r + dr) * N + c + dc);
      }
    } else if (sp === 'color') {
      const tt = target ?? mostCommonType();
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x]?.t === tt) out.push(y * N + x);
    } else if (sp === 'all') {
      for (let i = 0; i < N * N; i++) out.push(i);
    } else if (sp === 'hit1') {
      out.push(k);
    } else if (sp === 'db') {
      for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) if (inB(r + dr, c + dc)) out.push((r + dr) * N + c + dc);
      const to = pickTarget(new Set(out));
      if (to !== null) { out.push(to); effectCells.to = to; }
    }
    return out;
  }
  // ダンベルの飛び先：ボス → 目標の障害物 → ロッカー → 目標アイテム → どこか
  function pickTarget(skip) {
    const pick = arr => { const a = arr.filter(k => !skip.has(k)); return a.length ? a[Math.floor(Math.random() * a.length)] : null; };
    const all = [...Array(N * N).keys()];
    const tries = [
      bossObj ? bossObj.cells.map(([r, c]) => r * N + c) : [],
      all.filter(k => { const o = obsAt(k); return o && o.kind !== 'boss' && goals[o.kind] > 0; }),
      all.filter(k => isLockedK(k)),
      all.filter(k => { const t = tileAt(k); return t && t.t >= 0 && goals[t.t] > 0; }),
      all.filter(k => tileAt(k))
    ];
    for (const arr of tries) { const k = pick(arr); if (k !== null) return k; }
    return null;
  }
  function computeClear(matchCells, acts, spawnKeys) {
    const clear = new Set(matchCells), hits = new Set(), strong = new Set(), fired = new Set(), effects = [];
    // そろえたマスのとなりにある障害物にダメージ
    for (const k of matchCells) {
      const r = Math.floor(k / N), c = k % N;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (inB(r + dr, c + dc) && obs[r + dr][c + dc]) hits.add((r + dr) * N + c + dc);
      }
    }
    const queue = [...acts];
    while (queue.length) {
      const a = queue.shift();
      if (fired.has(a.k)) continue;
      const tile = tileAt(a.k);
      const sp = a.sp || tile?.sp;
      if (!sp) continue;
      fired.add(a.k);
      if (tile) clear.add(a.k);
      effectCells.to = null;
      const cellsHit = effectCells(sp, a.k, a.target);
      effects.push({ sp, k: a.k, to: effectCells.to });
      for (const k of cellsHit) {
        if (spawnKeys.has(k) || holeAt(k)) continue;
        if (obsAt(k)) { hits.add(k); strong.add(k); continue; }
        const t = tileAt(k);
        if (!t) continue;
        clear.add(k);
        // ゴールデンプロテイン：消したアイテムのとなりの障害物にもダメージ
        if (sp === 'color') {
          const r = Math.floor(k / N), c = k % N;
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            if (inB(r + dr, c + dc) && obs[r + dr][c + dc]) hits.add((r + dr) * N + c + dc);
          }
        }
        if (t.sp && !fired.has(k)) queue.push({ k });
      }
    }
    spawnKeys.forEach(k => clear.delete(k));
    return { clear, hits, strong, effects };
  }
  // strong = 特殊アイテムで当てたマス（ボスには2ダメージ）
  function damage(hits, strong = new Set()) {
    const kinds = new Set();
    let bossDown = false;
    for (const k of hits) {
      const o = obsAt(k);
      if (!o) continue;
      o.hp -= (o.kind === 'boss' && strong.has(k)) ? 2 : 1;
      kinds.add(o.kind);
      if (o.kind === 'boss') {
        goals.boss = Math.max(0, o.hp);
        updateGoal('boss');
        o.bar.style.width = Math.max(0, o.hp / o.max * 100) + '%';
        if (o.hp > 0 && o.hp <= o.max * 0.3 && !BGM.fast) {
          BGM.setFast(true);
          setTimeout(() => toast('<em>ラストスパート！</em>'), 500);
        }
        if (o.hp <= 0) {
          o.el.classList.add('gone');
          setTimeout(() => o.el.remove(), 420);
          o.cells.forEach(([r, c]) => (obs[r][c] = null));
          bossObj = null;
          bossDown = true;
        } else {
          o.el.classList.remove('hit');
          o.el.offsetWidth;
          o.el.classList.add('hit');
        }
        continue;
      }
      if (o.hp <= 0) {
        o.el.classList.add('gone');
        setTimeout(() => o.el.remove(), D.pop + 10);
        obs[Math.floor(k / N)][k % N] = null;
        if (o.kind === 'sweat') sweatCleared = true;
        if (goals[o.kind] > 0) { goals[o.kind]--; updateGoal(o.kind); }
      } else {
        o.el.classList.add('cracked');
        o.el.classList.remove('hit');
        o.el.offsetWidth;
        o.el.classList.add('hit');
      }
    }
    if (kinds.has('box')) SFX.box();
    if (kinds.has('tire')) SFX.tire();
    if (kinds.has('sweat')) SFX.sweat();
    if (bossDown) { SFX.bossDown(); setTimeout(() => toast('コーチ<em>撃破！</em>'), 200); }
    else if (kinds.has('boss')) SFX.bossHit();
  }

  // ---------- 盤面操作 ----------
  function swapCells(r1, c1, r2, c2) {
    const a = grid[r1][c1], b = grid[r2][c2];
    a.el.classList.add('swap'); b.el.classList.add('swap');
    grid[r1][c1] = b; grid[r2][c2] = a;
    place(b, r1, c1); place(a, r2, c2);
    setTimeout(() => { a.el.classList.remove('swap'); b.el.classList.remove('swap'); }, D.swap + 20);
  }

  async function trySwap(r1, c1, r2, c2) {
    if (busy) return;
    if (!inB(r2, c2) || !grid[r1][c1] || !grid[r2][c2]) return;
    if (isLocked(r1, c1) || isLocked(r2, c2)) { clearSel(); SFX.invalid(); return; }
    busy = true;
    clearHint(); clearSel();
    const a = grid[r1][c1], b = grid[r2][c2];
    SFX.swap();
    swapCells(r1, c1, r2, c2);
    await sleep(D.swap + 20);

    const acts = [];
    if (a.sp || b.sp) {
      const col = a.sp === 'color' ? a : b.sp === 'color' ? b : null;
      if (col) {
        const other = col === a ? b : a;
        if (other.sp) { acts.push({ k: keyOf(col), sp: 'all' }); pendingNote = '合体技！ <em>全消し</em>'; }
        else acts.push({ k: keyOf(col), sp: 'color', target: other.t });
      } else if (a.sp && b.sp) {
        if (a.sp === 'bomb' || b.sp === 'bomb') {
          acts.push({ k: keyOf(a), sp: 'bomb' });
          for (const [dr, dc] of [[-3, 0], [3, 0], [0, -3], [0, 3]]) {
            if (inB(a.r + dr, a.c + dc)) acts.push({ k: (a.r + dr) * N + a.c + dc, sp: 'bomb' });
          }
          pendingNote = '合体技！ <em>大爆発</em>';
        } else if (a.sp !== 'db' && b.sp !== 'db') {
          acts.push({ k: keyOf(a), sp: 'h' }, { k: keyOf(b), sp: 'v' });
          pendingNote = '合体技！ <em>クロス</em>';
        } else {
          acts.push({ k: keyOf(a) }, { k: keyOf(b) });
          pendingNote = '合体技！ <em>ダブル</em>';
        }
      } else {
        if (a.sp) acts.push({ k: keyOf(a) });
        if (b.sp) acts.push({ k: keyOf(b) });
      }
    } else if (!hasMatch(typesOf())) {
      SFX.invalid();
      swapCells(r1, c1, r2, c2);
      await sleep(D.swap + 20);
      busy = false;
      scheduleHint();
      return;
    }
    moves--;
    renderHud();
    await resolve(new Set([keyOf(a), keyOf(b)]), acts);
    afterMove();
  }

  async function tapSpecial(r, c) {
    if (busy) return;
    busy = true;
    clearHint(); clearSel();
    moves--;
    renderHud();
    await resolve(new Set(), [{ k: r * N + c }]);
    afterMove();
  }

  async function afterMove() {
    if (goalsDone()) return stageClear();
    movesUsed++;
    await sweatSpread();
    await bossAttack();
    if (moves <= 0) return stageFail();
    if (!anySpecial() && !findMove(typesOf())) await shuffle();
    busy = false;
    scheduleHint();
  }

  // 汗：1手のあいだに1つも拭かなかったら、となりのマスに1つ広がる
  async function sweatSpread() {
    if (sweatCleared) { sweatCleared = false; return; }
    const cands = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (obs[r][c]?.kind !== 'sweat') continue;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const y = r + dr, x = c + dc;
        if (inB(y, x) && grid[y][x] && !grid[y][x].sp && !isLocked(y, x)) cands.push([y, x]);
      }
    }
    if (!cands.length) return;
    const [y, x] = cands[Math.floor(Math.random() * cands.length)];
    const tile = grid[y][x];
    tile.el.classList.add('pop');
    setTimeout(() => tile.el.remove(), D.pop + 10);
    grid[y][x] = null;
    const o = makeObs('sweat', y, x);
    o.el.classList.add('born');
    goals.sweat = (goals.sweat || 0) + 1;
    if (!$('goal-sweat')) renderGoals(); else updateGoal('sweat');
    SFX.drip();
    toast('汗が<em>広がった</em>');
    await sleep(380);
  }

  // コーチの喝：5手ごとに、アイテム1つをロッカーに閉じこめる
  async function bossAttack() {
    if (!bossObj || movesUsed % 5 !== 0 || moves <= 0) return;
    const pool = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (t && !t.sp && !isLocked(r, c)) pool.push([r, c]);
    }
    if (!pool.length) return;
    bossObj.el.classList.remove('angry');
    bossObj.el.offsetWidth;
    bossObj.el.classList.add('angry');
    SFX.whistle();
    toast('コーチの<em>喝！</em><br><small>ロッカーに閉じこめられた</small>');
    await sleep(420);
    for (let i = 0; i < 1 && pool.length; i++) {
      const [r, c] = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      addLock(r, c, 2);
    }
    SFX.lock();
    await sleep(380);
  }

  let pendingNote = null;

  async function resolve(focus, acts, reward = true) {
    let chain = 0;
    while (true) {
      const first = chain === 0;
      const { cells, spawns } = findGroups(typesOf(), first ? focus : new Set());
      const nowActs = first ? acts : [];
      if (!cells.size && !nowActs.length) break;
      chain++;
      const spawnKeys = new Set(spawns.map(s => s.k));
      const { clear, hits, strong, effects } = computeClear(cells, nowActs, spawnKeys);

      const touched = new Set();
      for (const k of [...clear, ...spawnKeys]) {
        const tile = tileAt(k);
        if (tile && tile.t >= 0 && !isLockedK(k) && goals[tile.t] > 0) { goals[tile.t]--; touched.add(tile.t); }
      }
      touched.forEach(updateGoal);

      const gain = (clear.size + spawnKeys.size) * 10 * chain + effects.length * 50 + hits.size * 20;
      score += gain;
      renderHud();

      if (effects.length) {
        const kinds = new Set(effects.map(e => e.sp));
        if (kinds.has('all') || kinds.has('color')) SFX.color();
        if (kinds.has('bomb')) SFX.bomb();
        if (kinds.has('h') || kinds.has('v')) SFX.line();
        if (kinds.has('db')) SFX.db();
        if (kinds.has('hit1')) SFX.punch();
        effects.forEach(e => flash(e.sp, e.k, e.to));
      } else SFX.match(chain);
      if (pendingNote) { toast(`${pendingNote}<br><small>+${gain}kg</small>`); pendingNote = null; }
      else if (spawns.length) toast(`<em>${SP_NAMES[spawns[0].sp]}</em><br><small>完成！</small>`);
      else {
        const cheer = CHEERS[Math.min(chain, CHEERS.length - 1)];
        toast(chain >= 2 ? `${chain}連鎖 <em>+${gain}kg</em><br><small>${cheer}</small>` : `<em>+${gain}kg</em>`);
      }

      spawns.forEach(s => setSpecial(tileAt(s.k), s.sp));
      if (spawns.length) SFX.spawn();
      damage(hits, strong);
      let unlocked = false;

      for (const k of clear) {
        const tile = tileAt(k);
        if (!tile) continue;
        if (isLockedK(k)) { unlock(k); unlocked = true; continue; }
        tile.el.classList.add('pop');
        setTimeout(() => tile.el.remove(), D.pop + 10);
        grid[Math.floor(k / N)][k % N] = null;
      }
      if (unlocked) SFX.unlock();
      await sleep(effects.length ? D.pop + 120 : D.pop);
      drop();
      await sleep(D.fall);
      SFX.land();
      await sleep(40);
    }
    if (reward) {
      const sp = chain >= 7 ? 'color' : chain >= 5 ? 'bomb' : chain >= 3 ? (Math.random() < 0.5 ? 'h' : 'v') : null;
      if (sp) {
        const pool = grid.flat().filter(t => t && t.t >= 0);
        if (pool.length) {
          const tile = pool[Math.floor(Math.random() * pool.length)];
          await sleep(150);
          setSpecial(tile, sp);
          SFX.spawn();
          toast(`${chain}連鎖ボーナス！<br><small><em>${SP_NAMES[sp]}</em> ゲット</small>`);
          await sleep(500);
        }
      }
    }
    if (!anySpecial() && !findMove(typesOf())) await shuffle();
  }

  // 落下：穴と障害物はとばして、下から詰める（障害物の裏をすり抜けて落ちる）
  function drop() {
    const fresh = [];
    for (let c = 0; c < N; c++) {
      const slots = [];
      for (let r = 0; r < N; r++) if (isSlot(r, c) && !isLocked(r, c)) slots.push(r);
      const tiles = [];
      for (let i = slots.length - 1; i >= 0; i--) {
        const t = grid[slots[i]][c];
        if (t) tiles.push(t);
        grid[slots[i]][c] = null;
      }
      let i = slots.length - 1;
      for (const t of tiles) { grid[slots[i]][c] = t; i--; }
      const m = i + 1;
      for (let j = 0; j < m; j++) {
        const tile = makeTile(rand());
        tile.el.style.transition = 'none';
        place(tile, j - m, c);
        grid[slots[j]][c] = tile;
        fresh.push(tile);
      }
    }
    board.offsetWidth;
    fresh.forEach(t => (t.el.style.transition = ''));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) place(grid[r][c], r, c);
  }

  async function shuffle() {
    toast('<em>シャッフル</em>');
    await sleep(400);
    const types = safeTypes();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (t && !t.sp && !isLocked(r, c) && types[r][c] >= 0) setType(t, types[r][c]);
    }
    if (hasMatch(typesOf())) await resolve(new Set(), [], false);
  }

  function scheduleHint() {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      if (busy) return;
      const mv = findMove(typesOf()) || anySpecial();
      if (!mv) return;
      hinted = mv.map(([r, c]) => grid[r][c]).filter(Boolean);
      hinted.forEach(t => t.el.classList.add('hint'));
    }, 6000);
  }
  function clearHint() {
    clearTimeout(hintTimer);
    hinted.forEach(t => t.el.classList.remove('hint'));
    hinted = [];
  }
  function clearSel() {
    if (selected) grid[selected[0]]?.[selected[1]]?.el.classList.remove('sel');
    selected = null;
  }

  // ---------- 入力 ----------
  let start = null;
  function cellAt(e) {
    const rect = board.getBoundingClientRect();
    const s = rect.width / N;
    const c = Math.floor((e.clientX - rect.left) / s);
    const r = Math.floor((e.clientY - rect.top) / s);
    if (!inB(r, c)) return null;
    return { r, c, s };
  }
  board.addEventListener('pointerdown', e => {
    if (busy) return;
    const cell = cellAt(e);
    if (!cell) return;
    if (aiming) { if (!hole[cell.r][cell.c]) start = { ...cell, aim: true }; return; }
    if (!grid[cell.r][cell.c]) return;
    start = { ...cell, x: e.clientX, y: e.clientY, moved: false };
    board.setPointerCapture(e.pointerId);
  });
  board.addEventListener('pointermove', e => {
    if (!start || start.moved || start.aim) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    const th = start.s * 0.35;
    if (Math.abs(dx) < th && Math.abs(dy) < th) return;
    start.moved = true;
    const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
    trySwap(start.r, start.c, start.r + dr, start.c + dc);
  });
  board.addEventListener('pointerup', () => {
    if (!start) return;
    const { r, c, moved, aim } = start;
    start = null;
    if (aim) { if (aiming && !busy) useTool(TOOLS.find(t => t.id === aiming), r, c); return; }
    if (moved || busy || !grid[r][c]) return;
    if (isLocked(r, c)) { clearSel(); SFX.invalid(); return; }
    if (selected) {
      const [sr, sc] = selected;
      if (Math.abs(sr - r) + Math.abs(sc - c) === 1) { trySwap(sr, sc, r, c); return; }
      clearSel();
      if (sr === r && sc === c) return;
    }
    if (grid[r][c].sp) { tapSpecial(r, c); return; }
    selected = [r, c];
    grid[r][c].el.classList.add('sel');
    SFX.select();
  });
  board.addEventListener('pointercancel', () => { start = null; });

  $('retry').addEventListener('click', () => startStage(stageIdx));
  $('toMenu').addEventListener('click', showMenu);
  $('help').addEventListener('click', () => { if (!$('overlay')) showGuide(); });
  showMenu();
})();
</script>
