<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2023">
<meta name="apple-mobile-web-app-title" content="マッスルマッチ">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}</style>
<title>マッスルマッチ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one-screen game with two views (training calendar / board). Rubber gym-floor ground, chalk-white type, plate colors carry the pieces; specials are steel and gold. Deliberately single dark theme. */
:root {
  --floor: #1c2023;
  --mat: #262b2f;
  --mat-line: #30363b;
  --mat-hi: #343c42;
  --chalk: #f1efe8;
  --chalk-dim: #a3a9ad;
  --accent: #f0b429;
  --good: #4fbc7f;
  --steel: #626c74;
  --steel-d: #2c3237;
  --gold: #ffe08a;
  --gold-d: #d9971a;
  --t0: #d9473f; --t0h: #ec6a61;
  --t1: #3b7dd8; --t1h: #5f9bec;
  --t2: #d99a1e; --t2h: #efbb4d;
  --t3: #2f9a5f; --t3h: #4fbc7f;
  --t4: #8456cf; --t4h: #a47ce6;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --d-swap: 170ms;
  --d-fall: 280ms;
  --d-pop: 220ms;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) {
  :root { --d-swap: 60ms; --d-fall: 90ms; --d-pop: 80ms; }
}
html, body { height: 100%; }
body {
  background: var(--floor);
  color: var(--chalk);
  font-family: var(--body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  height: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; min-width: 0; overflow: hidden; margin: 0; letter-spacing: .02em; white-space: nowrap; }
h1 span { color: var(--accent); }
.tools { display: flex; gap: 6px; }
.pill {
  font: 700 .78rem var(--body);
  color: var(--chalk);
  background: var(--mat);
  border: 1px solid var(--mat-line);
  border-radius: 999px;
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.pill[aria-pressed="false"] { color: var(--chalk-dim); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
#gameView { justify-content: center; gap: 10px; }
#gameView > * { flex: none; }
#gameView .goals { gap: 6px; }
#gameView .goal { font-size: .9rem; padding: 3px 8px 3px 3px; }
#gameView .goal .mini { width: 24px; height: 24px; border-radius: 7px; }

/* ----- トレーニング記録（ステージ選択） ----- */
.menu-top { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.menu-top h2 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.menu-top p { margin: 2px 0 0; font-size: .8rem; color: var(--chalk-dim); }
.total { text-align: right; }
.total .kg { font-family: var(--display); font-size: .95rem; font-variant-numeric: tabular-nums; }
.total .num { font-family: var(--display); font-size: 1.4rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.weeks { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 8px; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.week-h b { font-family: var(--display); font-weight: 400; font-size: .95rem; letter-spacing: .06em; }
.week-h span { font-size: .75rem; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dayb {
  aspect-ratio: 4 / 5;
  max-width: 100%;
  border-radius: 10px;
  background: var(--mat);
  border: 1px solid var(--mat-line);
  color: var(--chalk);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 0;
  cursor: pointer;
  font-family: var(--body);
}
.dayb .d { font-size: .58rem; color: var(--chalk-dim); font-weight: 700; letter-spacing: .04em; }
.dayb .p { font-family: var(--display); font-size: 1.15rem; line-height: 1.1; }
.dayb .s { font-size: .58rem; letter-spacing: .05em; color: var(--mat-line); }
.dayb .s i { font-style: normal; color: var(--accent); }
.dayb.bossday .p { color: var(--t0h); }
[hidden] { display: none !important; }
.dayb.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(240, 180, 41, .25); }
.dayb.locked { opacity: .32; cursor: default; }
.legend { font-size: .75rem; color: var(--chalk-dim); line-height: 1.6; margin: 0; }
.boost { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
.bst {
  display: flex; align-items: center; gap: 7px; min-width: 0;
  padding: 6px 7px; border-radius: 10px; cursor: pointer; text-align: left;
  background: var(--mat); border: 1px solid var(--mat-line); color: var(--chalk);
  font: 700 .72rem/1.25 var(--body);
}
.bst .bt { min-width: 0; }
.bst small { display: block; color: var(--chalk-dim); font-weight: 500; font-size: .64rem; }
.bst .price { display: block; margin-top: 2px; font-family: var(--display); font-weight: 400; font-size: .9rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.bst.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--steel-d); }
.bst:disabled { opacity: .35; cursor: default; }
.wallet-line { font-size: .8rem !important; }
.wallet-line b { color: var(--accent); font-variant-numeric: tabular-nums; }
.toolbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 5px 2px 4px; border-radius: 12px; cursor: pointer;
  background: var(--mat-hi); border: 1px solid var(--steel); color: var(--chalk);
  font: 700 .74rem/1.25 var(--body);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}
.tool svg { width: 26px; height: 26px; fill: currentColor; color: var(--accent); }
.tool .tp.free, .bst .price.free { color: var(--good); }
.tool .tp { font-family: var(--display); font-weight: 400; font-size: .8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.tool.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--steel-d); }
.tool:disabled { opacity: .35; cursor: default; }
.aimtip {
  position: absolute; z-index: 6; left: 50%; top: 8px; transform: translateX(-50%);
  background: var(--accent); color: var(--floor); font: 700 .78rem var(--body);
  padding: 6px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}
#board.aiming { box-shadow: 0 0 0 3px var(--accent); border-radius: 6px; }
.lbgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
.lb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; background: var(--mat); border: 1px solid var(--mat-line); }
.lb .mini { width: 28px; height: 28px; }
.lbd { font-size: .62rem; font-weight: 700; color: var(--chalk-dim); }
.lbn { font-size: .56rem; line-height: 1.25; color: var(--chalk); text-align: center; }
.lb.got { opacity: .4; }
.lb.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--steel-d); }
.lb.today .lbd { color: var(--accent); }
.kin { display: flex; gap: 10px; align-items: center; }
.kin-av {
  width: 86px; height: 86px; flex: none; padding: 0; cursor: pointer;
  border-radius: 18px; border: 1px solid var(--mat-line);
  background: radial-gradient(circle at 50% 60%, rgba(240, 180, 41, .25), rgba(240, 180, 41, 0) 70%), var(--mat);
  overflow: hidden;
}
.kin-av svg { width: 100%; height: 100%; display: block; }
.kin-av.bounce svg { animation: kinBounce 420ms cubic-bezier(.2,.9,.3,1.4); }
@keyframes kinBounce { 30% { transform: translateY(-8%) scale(1.06); } }
.bubble {
  position: relative; min-width: 0; flex: 1;
  background: var(--mat-hi); border: 1px solid var(--steel); border-radius: 12px;
  padding: 7px 10px; font-size: .82rem; line-height: 1.5; text-align: left;
}
.bubble::before {
  content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px;
  background: var(--mat-hi); border-left: 1px solid var(--steel); border-bottom: 1px solid var(--steel);
  transform: translateY(-50%) rotate(45deg);
}
.bubble .who { display: block; font-size: .66rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.kin-card { width: 100%; }
.kin-card .kin-av { width: 70px; height: 70px; cursor: default; }
@media (max-width: 380px) { h1 { font-size: 1rem; } header .pill { padding: 6px 8px; font-size: .74rem; } header .tools { gap: 5px; } }
.menu-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.xfer { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.xfer h3 { margin: 6px 0 0; font-size: .8rem; letter-spacing: .1em; color: var(--chalk-dim); }
.xfer textarea {
  width: 100%; box-sizing: border-box; min-height: 64px; resize: none;
  font: 500 .75rem/1.4 ui-monospace, Menlo, Consolas, monospace;
  color: var(--chalk); background: var(--mat); border: 1px solid var(--mat-line); border-radius: 10px; padding: 8px;
  -webkit-user-select: text; user-select: text; word-break: break-all;
}
.xfer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.xfer .msg { font-size: .8rem; min-height: 1.2em; margin: 0; color: var(--chalk-dim); }
.xfer .msg.ok { color: var(--good); } .xfer .msg.ng { color: var(--t0h); }

/* ----- ゲーム画面 ----- */
.hud { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
.day { min-width: 0; }
.label { font-size: .68rem; letter-spacing: .12em; color: var(--chalk-dim); font-weight: 700; }
.day-num { font-family: var(--display); font-size: 1rem; color: var(--accent); }
.day-name { font-weight: 700; font-size: 1rem; }
.moves { text-align: center; background: var(--mat); border-radius: 12px; padding: 6px 14px; min-width: 72px; }
.moves .num { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.moves.low .num { color: var(--t0h); }

.goals { display: flex; flex-wrap: wrap; gap: 8px; }
.goal {
  display: flex; align-items: center; gap: 6px;
  background: var(--mat);
  border-radius: 10px;
  padding: 4px 10px 4px 4px;
  font-family: var(--display);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  transition: transform 120ms;
}
.goal.bump { transform: scale(1.12); }
.goal.done .count { color: var(--good); }
.mini {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--hi), var(--c));
  color: var(--chalk);
}
.mini svg { width: 70%; height: 70%; fill: currentColor; }
.mini[data-o] { background: var(--mat-line); }
.mini[data-o] svg { width: 88%; height: 88%; }
.score-line { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; color: var(--chalk-dim); }
.score-line #walletG { color: var(--accent); }
.score-line b { font-family: var(--display); font-weight: 400; color: var(--chalk); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

#gameView > .board-wrap { position: relative; display: flex; justify-content: center; }
#board {
  position: relative;
  flex: none;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  touch-action: none;
}
.cell, .tile, .obs {
  position: absolute; left: 0; top: 0;
  width: 12.5%; height: 12.5%;
}
.cell { background: var(--mat); box-shadow: inset 0 0 0 .5px var(--mat-line); z-index: 0; }
.cell.r-tl { border-top-left-radius: 10px; } .cell.r-tr { border-top-right-radius: 10px; }
.cell.r-bl { border-bottom-left-radius: 10px; } .cell.r-br { border-bottom-right-radius: 10px; }
[data-t="0"] { --c: var(--t0); --hi: var(--t0h); }
[data-t="1"] { --c: var(--t1); --hi: var(--t1h); }
[data-t="2"] { --c: var(--t2); --hi: var(--t2h); }
[data-t="3"] { --c: var(--t3); --hi: var(--t3h); }
[data-t="4"] { --c: var(--t4); --hi: var(--t4h); }
.tile {
  z-index: 1;
  transition: transform var(--d-fall) cubic-bezier(.35,.1,.35,1);
  will-change: transform;
}
.tile.swap { transition-duration: var(--d-swap); }
.tile .in {
  position: absolute; inset: 7%;
  border-radius: 22%;
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--hi), var(--c));
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.22), 0 2px 0 rgba(0,0,0,.25);
  color: var(--chalk);
  transition: transform 120ms;
}
.tile .in svg { width: 66%; height: 66%; fill: currentColor; }

/* 障害物 */
.obs { z-index: 2; }
.obs .in { position: absolute; inset: 3%; display: grid; place-items: center; }
.obs .in svg { width: 100%; height: 100%; }
.obs.hit .in { animation: shake 260ms; }
.obs.gone .in { animation: pop var(--d-pop) ease-in forwards; }
.crack { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; opacity: 0; }
.obs.cracked .crack { opacity: 1; }
@keyframes shake { 25% { transform: translateX(-6%) rotate(-4deg); } 75% { transform: translateX(6%) rotate(4deg); } }

/* ロッカー（アイテムの上にかぶさる） */
.lockov { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; z-index: 2; pointer-events: none; }
.lockov svg { position: absolute; inset: 4%; width: 92%; height: 92%; }
.lockov.born svg { animation: born 320ms cubic-bezier(.2,.9,.3,1.4); }
.lockov.gone svg { animation: unlock 300ms ease-in forwards; }
@keyframes unlock { 40% { transform: scale(1.15); } 100% { transform: scale(.4) translateY(-30%); opacity: 0; } }
.tile.locked .in { filter: saturate(.55) brightness(.75); }

/* ボス */
.boss { position: absolute; z-index: 2; width: 25%; height: 25%; padding: 1.5%; box-sizing: border-box; }
.boss svg { width: 100%; height: 100%; display: block; }
.boss .hp { position: absolute; left: 10%; right: 10%; bottom: 6%; height: 9%; background: rgba(0,0,0,.65); border-radius: 99px; overflow: hidden; box-shadow: 0 0 0 1.5px var(--chalk); }
.boss .hp i { display: block; height: 100%; width: 100%; background: var(--t0h); transition: width 200ms; }
.boss.hit svg { animation: shake 260ms; }
.boss.angry svg { animation: angry 420ms; }
.boss.gone { animation: pop 400ms ease-in forwards; }
@keyframes angry { 30% { transform: scale(1.12) rotate(-3deg); } 60% { transform: scale(1.12) rotate(3deg); } }

/* 特殊アイテム */
.tile[data-sp] .in, .mini[data-sp] {
  background: linear-gradient(160deg, var(--steel), var(--steel-d));
  color: var(--accent);
  box-shadow: inset 0 0 0 2px var(--accent), inset 0 -3px 0 rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.3);
}
.tile[data-sp] .in svg { width: 80%; height: 80%; }
.tile[data-sp="color"] .in, .mini[data-sp="color"] {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-d) 45%, var(--gold) 55%, var(--gold-d) 100%);
  background-size: 250% 250%;
  color: var(--steel-d);
  box-shadow: inset 0 0 0 2px var(--chalk), 0 0 10px rgba(255, 210, 100, .55);
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
.ball-line { fill: none; stroke: var(--steel-d); stroke-width: 2.4; }
.tile.born .in { animation: born 320ms cubic-bezier(.2,.9,.3,1.4); }
@keyframes born { from { transform: scale(1.6); } to { transform: scale(1); } }

.tile.sel .in { transform: scale(1.1); box-shadow: 0 0 0 3px var(--chalk), 0 4px 10px rgba(0,0,0,.4); }
.tile.pop .in { animation: pop var(--d-pop) ease-in forwards; }
.tile.hint .in { animation: nudge 900ms ease-in-out infinite; }
@keyframes pop { 30% { transform: scale(1.18); } 100% { transform: scale(0); opacity: 0; } }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.fx { position: absolute; pointer-events: none; z-index: 3; animation: fx 420ms ease-out forwards; }
.fx.line { background: linear-gradient(90deg, transparent, var(--gold), var(--chalk), var(--gold), transparent); }
.fx.line.v { background: linear-gradient(180deg, transparent, var(--gold), var(--chalk), var(--gold), transparent); }
.fx.boom { border-radius: 50%; background: radial-gradient(circle, var(--chalk) 0%, var(--gold) 35%, rgba(240, 180, 41, 0) 70%); }
.fly { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; z-index: 4; color: var(--accent); pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.fly svg { width: 100%; height: 100%; fill: currentColor; }
.fx.all { inset: 0; background: radial-gradient(circle, rgba(255, 224, 138, .9), rgba(255, 224, 138, 0) 75%); }
@keyframes fx { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }

.toast {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  font-family: var(--display);
  font-size: 1.6rem;
  color: var(--chalk);
  text-align: center;
  text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 18px rgba(0,0,0,.6);
  white-space: nowrap;
  pointer-events: none;
  animation: rise 900ms ease-out forwards;
  z-index: 5;
}
.toast em { font-style: normal; color: var(--accent); }
.toast small { font-size: .6em; }
@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
}

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(20, 23, 26, .82);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  border-radius: 14px;
  z-index: 10;
  padding: 12px;
  box-sizing: border-box;
}
.card {
  width: 100%; max-width: 320px;
  max-height: 100%; overflow-y: auto;
  box-sizing: border-box;
  background: var(--floor);
  border: 1px solid var(--mat-line);
  border-radius: 16px;
  padding: 18px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
  animation: cardIn 260ms cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardIn { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.card .big { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; }
.card .big.good { color: var(--accent); }
.card p { margin: 0; color: var(--chalk-dim); font-size: .9rem; line-height: 1.6; }
.guide { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.guide .row { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
.guide .mini { width: 36px; height: 36px; border-radius: 10px; }
.guide .mini svg { width: 82%; height: 82%; }
.guide b { display: block; font-size: .92rem; }
.guide span.how { font-size: .78rem; color: var(--chalk-dim); line-height: 1.45; }
.guide h3 { margin: 4px 0 0; font-size: .75rem; letter-spacing: .12em; color: var(--chalk-dim); }
.stars { display: flex; gap: 6px; }
.stars svg { width: 40px; height: 40px; fill: var(--mat-line); }
.stars svg.on { fill: var(--accent); animation: starIn 360ms cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.btns { display: flex; gap: 8px; width: 100%; }
.btn {
  flex: 1;
  font: 700 .95rem var(--body);
  border-radius: 12px;
  padding: 12px 10px;
  border: 0;
  cursor: pointer;
  color: var(--floor);
  background: var(--accent);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
}
.btn.sub { background: var(--mat); color: var(--chalk); }
.howto { font-size: .78rem; color: var(--chalk-dim); text-align: center; line-height: 1.5; margin: 0; }
</style>

<div class="app">
  <header>
    <button class="pill" id="toMenu" type="button" hidden>‹ メニュー</button>
    <h1 id="title">マッスル<span>マッチ</span></h1>
    <div class="tools">
      <button class="pill" id="sound" type="button" aria-pressed="true">音 ON</button>
      <button class="pill" id="voice" type="button" aria-pressed="true">声 ON</button>
      <button class="pill" id="help" type="button">遊び方</button>
      <button class="pill" id="retry" type="button" hidden>やり直し</button>
    </div>
  </header>

  <section class="view" id="menuView">
    <div class="menu-top">
      <div>
        <h2>トレーニング記録</h2>
        <p>1日1種目。7日目はコーチとのボス戦</p>
      </div>
      <div class="total"><div class="label">獲得スター</div><div class="num" id="totalStars">0</div><div class="label" style="margin-top:4px">貯めた重量</div><div class="kg" id="wallet">0 kg</div></div>
    </div>
    <div class="kin" id="kinRow">
      <button type="button" class="kin-av" id="kinAv" aria-label="筋一朗に話しかける"></button>
      <div class="bubble"><span class="who" id="kinWho">筋一朗</span><span id="kinSay"></span></div>
    </div>
    <div class="weeks" id="weeks"></div>
    <div class="menu-foot">
      <button class="pill" id="transfer" type="button">データ引き継ぎ</button>
      <p class="legend">バージョン 2.7</p>
    </div>
  </section>

  <section class="view" id="gameView" hidden>
    <div class="hud">
      <div class="day">
        <div class="day-num" id="dayNum">DAY 1</div>
        <div class="day-name" id="dayName">ベンチプレス</div>
      </div>
      <div class="moves" id="movesBox">
        <div class="label">残り手数</div>
        <div class="num" id="moves">20</div>
      </div>
    </div>
    <div class="goals" id="goals"></div>
    <div class="score-line"><span>総挙上量 <b id="score">0</b> kg</span><span>所持 <b id="walletG">0</b> kg</span></div>
    <div class="board-wrap" id="wrap">
      <div class="aimtip" id="aimtip" hidden></div>
      <div id="board" aria-label="ゲーム盤"></div>
    </div>
    <div class="toolbar" id="toolbar" aria-label="道具（手数を使わない）"></div>
  </section>
</div>

<script>
(() => {

  const BARBELL = '<rect x="2" y="18.5" width="36" height="3" rx="1"/><rect x="7" y="9" width="4" height="22" rx="1"/><rect x="12" y="12.5" width="3" height="15" rx="1"/><rect x="29" y="9" width="4" height="22" rx="1"/><rect x="25" y="12.5" width="3" height="15" rx="1"/><path d="M0 20l3-3v6z M40 20l-3-3v6z"/>';
  const SP_ICONS = {

    v: `<svg viewBox="0 0 40 40"><g transform="rotate(90 20 20)">${BARBELL}</g></svg>`,
    bomb: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><path class="ball-line" d="M5.5 20h29M20 5c-7 5-7 25 0 30M20 5c7 5 7 25 0 30"/></svg>',

  const OBS_ICONS = {

    tire: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#26292b"/><circle cx="20" cy="20" r="15.5" fill="none" stroke="#3f4447" stroke-width="5" stroke-dasharray="3.2 2.4"/><circle cx="20" cy="20" r="7.5" fill="#15181a"/><circle cx="20" cy="20" r="7.5" fill="none" stroke="#5b6266" stroke-width="2"/><path class="crack" d="M20 2.5l-3 5.5 4 3-3 5M37 22l-6 1-1 4"/></svg>'
  };
  OBS_ICONS.sweat = '<svg viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="10" fill="#6fa9cf" opacity=".6"/><path d="M14 7c-4.5 6.5-6.5 9.5-6.5 12.5a6.5 6.5 0 0 0 13 0c0-3-2-6-6.5-12.5z" fill="#d4ecfa"/><path d="M27.5 17c-3.2 4.4-4.7 6.8-4.7 8.9a4.7 4.7 0 0 0 9.4 0c0-2.1-1.5-4.5-4.7-8.9z" fill="#d4ecfa"/><path d="M12 31.5c4 1.5 12 1.5 16 0" stroke="#d4ecfa" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  OBS_ICONS.locker = '<svg viewBox="0 0 40 40"><rect x="2.5" y="2.5" width="35" height="35" rx="6" fill="none" stroke="#b9c2c8" stroke-width="3"/><path d="M2.5 11h35M2.5 29h35" stroke="#b9c2c8" stroke-width="2.6"/><path d="M8 6.5h10M8 33h10" stroke="#b9c2c8" stroke-width="1.6" stroke-linecap="round"/><rect x="14.5" y="18" width="11" height="9" rx="1.6" fill="#f0b429"/><path d="M16.8 18v-2.6a3.2 3.2 0 0 1 6.4 0V18" stroke="#f0b429" stroke-width="2.2" fill="none"/><circle cx="20" cy="22.5" r="1.4" fill="#2c3237"/></svg>';
  OBS_ICONS.boss = '<svg viewBox="0 0 80 80"><rect x="1" y="1" width="78" height="78" rx="12" fill="#3b2b2b"/><rect x="1" y="1" width="78" height="78" rx="12" fill="none" stroke="#d9473f" stroke-width="2.5"/><path d="M8 79c2-15 14-22 32-22s30 7 32 22z" fill="#d9473f"/><path d="M27 57v22M53 57v22" stroke="#3b2b2b" stroke-width="3"/><rect x="34" y="50" width="12" height="9" fill="#d9a070"/><circle cx="40" cy="33" r="18" fill="#e3b080"/><rect x="21" y="21" width="38" height="7" rx="2" fill="#f0b429"/><path d="M28.5 31.5l8 2.5M51.5 31.5l-8 2.5" stroke="#2c1d14" stroke-width="2.8" stroke-linecap="round"/><circle cx="33.5" cy="37.5" r="2" fill="#2c1d14"/><circle cx="46.5" cy="37.5" r="2" fill="#2c1d14"/><path d="M34 45.5q6 -3 12 0" stroke="#2c1d14" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M31 57l9 8 9-8" stroke="#f1efe8" stroke-width="1.6" fill="none"/><rect x="36" y="63" width="9" height="5" rx="2" fill="#c5ccd1"/></svg>';
  const OBS_INFO = { box: { hp: 1, name: 'プロテインの箱' }, tire: { hp: 2, name: 'タイヤ' }, sweat: { hp: 1, name: '汗' } };
  SP_ICONS.db = ICONS[0];
  const SP_NAMES = { h: 'バーベル', v: 'バーベル', bomb: 'メディシンボール', color: 'ゴールデンプロテイン', db: 'ダンベル' };
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';

  // ---------- ステージ ----------
  // マス目: "." 通常 / "x" 穴（マスなし） / "b" プロテインの箱（1回で壊れる） / "t" タイヤ（2回で壊れる）
  const PARTS = ['胸', '背中', '脚', '肩', '腕', '腹', 'ボス'];
  const PART_SHORT = ['胸', '背', '脚', '肩', '腕', '腹', '鬼'];
  const EXERCISES = [
    ['ベンチプレス', 'インクラインベンチ', 'ダンベルフライ', 'ケーブルクロス', '腕立て伏せ'],
    ['懸垂', 'デッドリフト', 'ラットプルダウン', 'ベントオーバーロウ', 'シーテッドロウ'],
    ['スクワット', 'ブルガリアンスクワット', 'レッグプレス', 'ランジ', 'カーフレイズ'],
    ['ショルダープレス', 'サイドレイズ', 'リアレイズ', 'アップライトロウ', 'フェイスプル'],
    ['アームカール', 'ディップス', 'ハンマーカール', 'フレンチプレス', 'プリーチャーカール'],
    ['クランチ', 'プランク', 'レッグレイズ', 'アブローラー', 'ロシアンツイスト'],
    ['ゴリ松コーチ', 'マッチョ山トレーナー', '鬼塚コーチ', '鉄田トレーナー', '剛力コーチ']
  ];
  const F = '........';
  const SHAPES = {
    full:     [F, F, F, F, F, F, F, F],
    corners:  ['x......x', F, F, F, F, F, F, 'x......x'],
    cross:    ['xx....xx', 'xx....xx', F, F, F, F, 'xx....xx', 'xx....xx'],
    dumbbell: ['...xx...', '...xx...', F, F, F, F, '...xx...', '...xx...'],
    diamond:  ['xx....xx', 'x......x', F, F, F, F, 'x......x', 'xx....xx'],
    plate:    ['xx....xx', 'x......x', F, '...xx...', '...xx...', F, 'x......x', 'xx....xx'],
    kettle:   ['xx....xx', 'xx.xx.xx', F, F, F, F, 'x......x', 'xx....xx']
  };
  const HAND = [
    // WEEK 1
    { part: 0, name: 'ベンチプレス', moves: 20, goals: { 0: 10 }, layout: SHAPES.full },
    { part: 1, name: '懸垂', moves: 22, goals: { 1: 12 }, layout: [F, F, F, '..bbbb..', F, F, F, F] },
    { part: 2, name: 'スクワット', moves: 22, goals: { 2: 15 }, layout: SHAPES.corners },
    { part: 3, name: 'ショルダープレス', moves: 22, goals: { 0: 10 }, layout: ['...xx...', '...xx...', F, F, '..l..l..', '.l....l.', '...xx...', '...xx...'] },
    { part: 4, name: 'アームカール', moves: 22, goals: { 3: 12 }, layout: [F, F, '.t....t.', F, F, '.t....t.', F, F] },
    { part: 5, name: 'クランチ', moves: 24, goals: {}, layout: ['xx....xx', 'x......x', F, F, F, '...ss...', 'x.ssss.x', 'xx....xx'] },
    { part: 6, name: 'ゴリ松コーチ', moves: 25, bossHp: 20, goals: {}, layout: [F, F, '...BB...', '...BB...', F, F, F, F] },
    // WEEK 2
    { part: 0, name: 'インクラインベンチ', moves: 24, goals: { 0: 15 }, layout: ['xx....xx', 'x......x', F, '.bb..bb.', '.bb..bb.', F, 'x......x', 'xx....xx'] },
    { part: 1, name: 'デッドリフト', moves: 24, goals: { 2: 18, 4: 12 }, layout: SHAPES.cross },
    { part: 2, name: 'ブルガリアンスクワット', moves: 25, goals: { 1: 12 }, layout: ['...xx...', '...xx...', '.t....t.', '...tt...', F, '.t....t.', '...xx...', '...xx...'] },
    { part: 3, name: 'サイドレイズ', moves: 24, goals: { 3: 14 }, layout: ['xx....xx', 'xx.xx.xx', F, F, 'l..ll..l', F, 'x......x', 'xx....xx'] },
    { part: 4, name: 'ディップス', moves: 26, goals: { 0: 10 }, layout: [F, 'bb....bb', 'bb....bb', '...ss...', F, 'bb....bb', 'bb....bb', F] },
    { part: 5, name: 'プランク', moves: 26, goals: { 4: 12 }, layout: ['xx....xx', 'x..ll..x', '...tt...', '..t..t..', '..s..s..', F, 'x......x', 'xx....xx'] },
    { part: 6, name: 'マッチョ山トレーナー', moves: 26, bossHp: 28, goals: {}, layout: ['xx....xx', 'x......x', F, '...BB...', '...BB...', '.l....l.', 'x......x', 'xx....xx'] }
  ];
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // WEEK 3以降は自動生成（同じDAYは毎回同じ内容）
  function genStage(i) {
    const w = Math.floor(i / 7), d = i % 7, R = rng(i * 7919 + 13);
    const pick = arr => arr[Math.floor(R() * arr.length)];
    const name = EXERCISES[d][w % 5];
    const bossDay = d === 6;
    const base = (bossDay ? pick([SHAPES.full, SHAPES.corners, SHAPES.diamond, SHAPES.cross]) : pick(Object.values(SHAPES))).map(s => s.split(''));
    if (bossDay) { base[3][3] = base[3][4] = base[4][3] = base[4][4] = 'B'; }
    const open = [];
    base.forEach((row, r) => row.forEach((ch, c) => { if (ch === '.') open.push([r, c]); }));
    const place = (n, ch) => {
      for (let k = 0; k < n && open.length; k++) {
        const [r, c] = open.splice(Math.floor(R() * open.length), 1)[0];
        base[r][c] = ch;
      }
    };
    if (bossDay) {
      place(Math.min(Math.floor(w / 2), 3), 'l');
      return { part: d, name, moves: 26 + Math.min(w, 4), bossHp: Math.min(22 + w * 3, 45), goals: {}, layout: base.map(r => r.join('')) };
    }
    place(Math.min(4 + w, 12), 'b');
    if (w >= 3) place(Math.min(w - 1, 6), 't');
    if (w >= 2) place(2 + Math.floor(R() * 3), 'l');
    if (w >= 2 && R() < 0.45) place(2 + Math.floor(R() * 2), 's');
    const a = Math.floor(R() * TYPES);
    let b = Math.floor(R() * TYPES); if (b === a) b = (a + 2) % TYPES;
    const n = Math.min(10 + w * 2, 24);
    const goals = R() < 0.5 ? { [a]: n + 4 } : { [a]: n, [b]: n };
    return { part: d, name, moves: 24 + Math.floor(R() * 4), goals, layout: base.map(r => r.join('')) };
  }
  const getStage = i => (i < HAND.length ? HAND[i] : genStage(i));
  const partLabel = s => (s.part === 6 ? 'ボス戦' : PARTS[s.part] + 'の日');

  const D = (() => {
    const cs = getComputedStyle(document.documentElement);
    const ms = v => parseFloat(cs.getPropertyValue(v)) || 0;
    return { swap: ms('--d-swap'), fall: ms('--d-fall'), pop: ms('--d-pop') };
  })();
  const CHEERS = ['', '', 'ナイスセット！', 'いいパンプ！', 'ゾーン突入！', 'ビーストモード！'];

  const $ = id => document.getElementById(id);
  const board = $('board'), wrap = $('wrap');
  // 盤面は、画面の残りスペースに収まる大きさに自動で合わせる
  function fitBoard() {
    const gv = $('gameView');
    if (gv.hidden) return;
    const kids = [...gv.children].filter(el => !el.classList.contains('overlay'));
    const gap = parseFloat(getComputedStyle(gv).rowGap) || 0;
    let used = gap * (kids.length - 1);
    for (const el of kids) if (el !== wrap) used += el.offsetHeight;
    const size = Math.floor(Math.min(gv.clientWidth, gv.clientHeight - used, 560));
    if (size > 120) board.style.width = size + 'px';
  }
  try { new ResizeObserver(fitBoard).observe($('gameView')); } catch (e) {}
  addEventListener('resize', fitBoard);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = () => Math.floor(Math.random() * TYPES);
  const keyOf = tile => tile.r * N + tile.c;
  const tileAt = k => grid[Math.floor(k / N)][k % N];
  const obsAt = k => obs[Math.floor(k / N)][k % N];
  const holeAt = k => hole[Math.floor(k / N)][k % N];
  const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

  // ---------- 保存 ----------
  let progress = { unlocked: 0, stars: {} }, soundOn = true, seenGuide = false;
  try {
    const p = JSON.parse(localStorage.getItem('mm-progress') || 'null');
    if (p && typeof p.unlocked === 'number') progress = p;
    // 初回：これまでの進み具合に応じて重量をプレゼント
    if (typeof progress.kg !== 'number') progress.kg = progress.unlocked * 300;
    if (!progress.inv || typeof progress.inv !== 'object') progress.inv = {};
    soundOn = localStorage.getItem('mm-sound') !== 'off';
    seenGuide = localStorage.getItem('mm-guide3') === '1';
  } catch (e) {}
  const save = () => { try { localStorage.setItem('mm-progress', JSON.stringify(progress)); } catch (e) {} };

  // ---------- サウンド（Web Audioで合成） ----------
  let ac = null, master = null;
  function unlockAudio() {
    try {
      // iPhoneのマナーモード中でも音を鳴らす（Safari 17以降）
      if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    } catch (e) {}
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
      }
      if (ac.state !== 'running') ac.resume();
      // iPhone対策：無音を一瞬鳴らして音声を確実に有効にする
      if (!unlockAudio.done) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        unlockAudio.done = true;
      }
    } catch (e) {}
  }
  ['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));

  function tone(freq, dur, { type = 'sine', vol = 0.3, to = null, delay = 0, attack = 0.005 } = {}) {
    if (!soundOn || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, { vol = 0.2, freq = 1800, to = null, delay = 0 } = {}) {
    if (!soundOn || !ac) return;
    const t0 = ac.currentTime + delay;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(freq, t0);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }
  const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];
  const SFX = {
    swap()    { tone(520, 0.06, { type: 'triangle', vol: 0.18 }); },
    invalid() { tone(220, 0.08, { type: 'square', vol: 0.1 }); tone(165, 0.12, { type: 'square', vol: 0.1, delay: 0.09 }); },
    match(chain) {
      noise(0.12, { vol: 0.25, freq: 2600 });
      tone(880, 0.25, { vol: 0.08 }); tone(2310, 0.18, { vol: 0.05 });
      const n = NOTES[Math.min(chain - 1, NOTES.length - 1)];
      tone(n, 0.22, { type: 'triangle', vol: 0.22, delay: 0.02 });
    },

  // ---------- ボス戦BGM（Web Audioでその場で演奏するオリジナル曲） ----------
  const BGM = (() => {
    let timer = null, step = 0, next = 0, gain = null, fast = false, song = 'boss';
    const spb = () => 60 / (song === 'normal' ? 112 : song === 'menu' ? 96 : fast ? 172 : 150) / 4;
    const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
    const _ = null;
    const ROOTS = [45, 41, 43, 40]; // Am - F - G - E
    const MEL = [
      [69, _, 72, _, 76, _, 81, _, 79, 76, _, 72, 74, _, 76, _],
      [77, _, 76, _, 72, _, 69, _, 72, _, 74, _, 76, _, 77, _],
      [79, _, 77, _, 74, _, 71, _, 74, _, 79, _, 77, 76, 74, _],
      [76, _, _, _, 80, _, _, _, 83, _, 81, _, 80, _, 76, _]
    ];
    function osc(f, t, dur, type, vol) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(gain);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function hit(t, dur, vol, freq, type = 'bandpass') {
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = ac.createBufferSource(); s.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(gain); s.start(t);
    }
    function kick(t) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(gain); o.start(t); o.stop(t + 0.18);
    }
    // 通常ステージ用：明るめの軽い曲（C - Am - F - G）
    const N_ROOTS = [48, 45, 41, 43];
    const N_MEL = [
      [76, _, 79, _, 84, _, 79, _, 81, _, 79, _, 76, _, 74, _],
      [72, _, 76, _, _, _, 81, _, 79, _, 76, _, 72, _, _, _],
      [69, _, 72, _, 77, _, 81, _, 79, _, 77, _, 74, _, 72, _],
      [74, _, 79, _, 83, _, _, _, 84, _, 83, _, 79, _, _, _]
    ];
    function scheduleNormal(s, t) {
      const bar = Math.floor(s / 16), i = s % 16, len = spb();
      if (i % 4 === 0) osc(m2f(N_ROOTS[bar]), t, len * 3.5, 'triangle', 0.2);
      if (i % 4 === 2) osc(m2f(N_ROOTS[bar] + 7), t, len * 1.6, 'triangle', 0.1);
      const m = N_MEL[bar][i];
      if (m) { osc(m2f(m), t, len * 2.2, 'triangle', 0.07); osc(m2f(m + 12), t, len * 1.4, 'sine', 0.02); }
      if (i % 8 === 0) kick(t);
      if (i % 4 === 2) hit(t, 0.025, 0.05, 9000, 'highpass');
    }
    // メニュー用：チル＋前向き（Cmaj7 - Am7 - Dm7 - G7、後半4小節でメロディ）
    const M_CH = [[60, 64, 67, 71], [57, 60, 64, 67], [57, 60, 62, 65], [55, 59, 62, 65]];
    const M_BASS = [48, 45, 50, 43];
    const M_MEL = [
      [76, _, _, 79, _, _, 81, _, 79, _, 76, _, _, _, 74, _],
      [72, _, _, 76, _, _, 79, _, 76, _, _, _, 72, _, _, _],
      [74, _, _, 77, _, _, 81, _, 79, _, 77, _, 74, _, 72, _],
      [71, _, 74, _, 79, _, _, _, 77, _, 74, _, _, _, _, _]
    ];
    function ep(f, t, dur, vol) {
      // やわらかいエレピ風：サインに少しだけ倍音を足す
      osc(f, t, dur, 'sine', vol);
      osc(f * 2.003, t, dur * 0.5, 'sine', vol * 0.18);
    }
    function scheduleMenu(s, t) {
      const bar = Math.floor(s / 16) % 4, half = s >= 64, i = s % 16, len = spb();
      if (i === 0) M_CH[bar].forEach(m => ep(m2f(m), t, len * 13, 0.045));
      if (i === 10) M_CH[bar].forEach(m => ep(m2f(m), t, len * 5, 0.03));
      if (i === 0 || i === 7 || i === 10) osc(m2f(M_BASS[bar]), t, len * (i === 0 ? 6 : 3), 'triangle', 0.22);
      if (i === 0 || i === 8) kick(t);
      if (i === 4 || i === 12) hit(t, 0.07, 0.1, 1500);
      if (i % 2 === 0) hit(t, 0.02, i % 4 === 2 ? 0.05 : 0.025, 9000, 'highpass');
      if (half) {
        const m = M_MEL[bar][i];
        if (m) { osc(m2f(m), t, len * 3, 'triangle', 0.055); osc(m2f(m + 12), t, len * 1.5, 'sine', 0.015); }
      }
    }
    function schedule(s, t) {
      if (song === 'menu') return scheduleMenu(s, t);
      if (song === 'normal') return scheduleNormal(s, t);
      const bar = Math.floor(s / 16), i = s % 16, len = spb();
      if (i % 2 === 0) osc(m2f(ROOTS[bar] + (i % 4 === 2 ? 12 : 0)), t, len * 1.8, 'triangle', 0.32);
      const m = MEL[bar][i];
      if (m) { osc(m2f(m), t, len * 1.7, 'square', 0.055); osc(m2f(m + 12), t, len * 1.2, 'sine', 0.03); }
      if (i % 4 === 0) kick(t);
      if (i === 4 || i === 12) hit(t, 0.12, 0.28, 1800);
      if (i % 2 === 1) hit(t, 0.03, 0.1, 8000, 'highpass');

    }

      start(name = 'boss') {

        }

      setFast(v) { fast = v; }
    };
  })();

  const songName = () => (!$('menuView').hidden ? 'menu' : stage && stage.bossHp ? 'boss' : 'normal');

    else { BGM.stop(); try { speechSynthesis.cancel(); } catch (e) {} }

  // ---------- ゲーム状態 ----------
  let grid = [], obs = [], hole = [], lockMask = [], lockEls = [];
  let bossObj = null, movesUsed = 0, sweatCleared = false;
  const isLocked = (r, c) => !!(lockMask[r] && lockMask[r][c]);
  const isLockedK = k => isLocked(Math.floor(k / N), k % N);
  let busy = true, score = 0, selected = null, hintTimer = null, hinted = [];
  let stageIdx = 0, stage = null, moves = 0, goals = {};

  function posStyle(el, r, c) { el.style.transform = `translate(${c * 100}%, ${r * 100}%)`; }
  function makeTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.innerHTML = '<div class="in"></div>';
    const tile = { t, sp: null, el, r: 0, c: 0 };

  function setType(tile, t) {
    tile.t = t; tile.sp = null;

  const isSlot = (r, c) => inB(r, c) && !hole[r][c] && !obs[r][c];

  function safeTypes() {
    let types, tries = 0;
    do {
      types = [];
      for (let r = 0; r < N; r++) {
        types.push([]);
        for (let c = 0; c < N; c++) {
          if (!isSlot(r, c)) { types[r].push(-1); continue; }
          let t;
          do { t = rand(); } while (
            (c >= 2 && types[r][c - 1] === t && types[r][c - 2] === t) ||
            (r >= 2 && types[r - 1][c] === t && types[r - 2][c] === t) ||
            (r >= 1 && c >= 1 && types[r - 1][c] === t && types[r][c - 1] === t && types[r - 1][c - 1] === t)
          );

    } while (!findMove(types) && ++tries < 300);

  }
  const typesOf = () => grid.map(row => row.map(t => (t ? t.t : -1)));

  function findRuns(types) {
    const runs = [];
    for (let r = 0; r < N; r++) {
      let run = 1;
      for (let c = 1; c <= N; c++) {
        if (c < N && types[r][c] !== -1 && types[r][c] === types[r][c - 1]) run++;
        else {
          if (run >= 3) runs.push({ dir: 'h', cells: Array.from({ length: run }, (_, i) => r * N + (c - run + i)) });
          run = 1;
        }
      }
    }
    for (let c = 0; c < N; c++) {
      let run = 1;
      for (let r = 1; r <= N; r++) {
        if (r < N && types[r][c] !== -1 && types[r][c] === types[r - 1][c]) run++;
        else {
          if (run >= 3) runs.push({ dir: 'v', cells: Array.from({ length: run }, (_, i) => (r - run + i) * N + c) });
          run = 1;
        }

    }
    return runs;
  }
  // 2×2の正方形
  function findSquares(types) {
    const out = [];
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
      const t = types[r][c];
      if (t === -1) continue;
      if (types[r][c + 1] === t && types[r + 1][c] === t && types[r + 1][c + 1] === t) {
        out.push({ dir: 'sq', cells: [r * N + c, r * N + c + 1, (r + 1) * N + c, (r + 1) * N + c + 1] });

  const hasMatch = types => findRuns(types).length > 0 || findSquares(types).length > 0;

  function findGroups(types, focus) {
    const runs = findRuns(types).concat(findSquares(types));
    const parent = runs.map((_, i) => i);
    const find = i => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const owner = new Map(), count = new Map();
    runs.forEach((run, i) => run.cells.forEach(k => {
      count.set(k, (count.get(k) || 0) + 1);
      if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
    }));
    const groups = new Map();
    runs.forEach((run, i) => {
      const g = find(i);
      if (!groups.has(g)) groups.set(g, { runs: [], cells: new Set() });
      groups.get(g).runs.push(run);
      run.cells.forEach(k => groups.get(g).cells.add(k));
    });
    const cells = new Set(), spawns = [];
    for (const g of groups.values()) {
      g.cells.forEach(k => cells.add(k));
      const lines = g.runs.filter(r => r.dir !== 'sq');
      const longest = (lines.length ? lines : g.runs).reduce((a, b) => (b.cells.length > a.cells.length ? b : a));
      const hasH = g.runs.some(r => r.dir === 'h'), hasV = g.runs.some(r => r.dir === 'v');
      let sp = null;
      if (longest.cells.length >= 5) sp = 'color';
      else if (hasH && hasV) sp = 'bomb';
      else if (lines.length && longest.cells.length === 4) sp = longest.dir;
      else if (g.runs.some(r => r.dir === 'sq')) sp = 'db';

      if (k === undefined) k = longest.cells[Math.floor(longest.cells.length / 2)];
      if (isLockedK(k)) { k = [...g.cells].find(x => !isLockedK(x)); if (k === undefined) continue; }
      spawns.push({ k, sp });
    }
    return { cells, spawns };
  }

  function findMove(types) {
    const t = types.map(row => row.slice());
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (r2 >= N || c2 >= N) continue;
        if (t[r][c] === -1 || t[r2][c2] === -1 || isLocked(r, c) || isLocked(r2, c2)) continue;

        const ok = hasMatch(t);
        [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
        if (ok) return [[r, c], [r2, c2]];
      }
    }
    return null;
  }
  function anySpecial() {

  function parseCode(code) {
    const m = String(code).replace(/\s+/g, '').match(/^MM1-([A-Za-z0-9+/=]+)-(\d+)$/);
    if (!m) return null;
    if (checksum(m[1]) !== +m[2]) return null;
    let d;
    try { d = JSON.parse(atob(m[1])); } catch (e) { return null; }
    if (!d || !Number.isInteger(d.unlocked) || d.unlocked < 0 || d.unlocked > 100000 || typeof d.stars !== 'object' || !d.stars) return null;
    const stars = {};
    for (const [k, v] of Object.entries(d.stars)) {
      if (!/^\d+$/.test(k) || ![1, 2, 3].includes(v)) return null;
      stars[k] = v;
    }
    const kg = Number.isInteger(d.kg) && d.kg >= 0 && d.kg < 1e10 ? d.kg : 0;
    const inv = {};
    if (d.inv && typeof d.inv === 'object') for (const [k, v] of Object.entries(d.inv)) if (ITEM_NAMES[k] && Number.isInteger(v) && v >= 0 && v < 10000) inv[k] = v;
